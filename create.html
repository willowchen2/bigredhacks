<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a Palace - Locus Lane</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/nav.js"></script>

  <main class="create">
    <div class="card-panel">
      <header class="create-header">
        <h1>Create your memory walk</h1>
        <p class="sub">Paste study notes or upload a file to convert them into street stops.</p>
      </header>

      <!-- Custom styled upload button -->
      <div class="upload-row">
        <label for="file" class="file-btn">
          <span>📄</span> Upload .txt or .md
          <input type="file" id="file" accept=".txt,.md">
        </label>
        <span id="file-name" class="file-name">No file selected</span>
      </div>

      <textarea id="notes" placeholder="Paste your lecture notes, flashcard list, or study guide here..."></textarea>

      <!-- Clean grid controls -->
      <div class="form-grid">
        <div class="form-field">
          <label for="count">Number of stops</label>
          <input id="count" type="number" min="3" max="15" value="8">
        </div>

        <div class="form-field">
          <label for="place">Walking location</label>
          <select id="place"></select>
        </div>

        <div class="form-field action-field">
          <button id="extract" class="btn-primary">Split into stops</button>
        </div>
      </div>

      <p id="msg"></p>
    </div>

    <!-- Generated chunks list & footer actions -->
    <ul id="facts"></ul>

    <div class="build-bar">
      <button id="build" class="btn-primary" hidden>Build my palace &rarr;</button>
    </div>
  </main>

  <script src="js/palace.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
