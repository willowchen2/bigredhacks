<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walk your palace</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/nav.js"></script>
  <div id="stage">
    <div id="pano"></div>
    <div id="overlay"></div>
  </div>
  <section class="card walk-bar">
    <div class="walk-top">
      <small id="count"></small>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
    </div>
    <p id="instr"></p>
    <div class="row">
      <button id="prev">&larr; Back</button>
      <button id="reveal" class="btn-secondary">Show term</button>
      <button id="next">Next stop &rarr;</button>
    </div>
    <p id="status"></p>
  </section>
  <script src="js/config.js"></script>
  <script src="js/palace.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/walk.js"></script>
</body>
</html>
