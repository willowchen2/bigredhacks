<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place your pins</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script src="js/nav.js"></script>
  <div id="stage">
    <div id="pano"></div>
    <div id="overlay"></div>
  </div>
  <aside class="bank">
    <h2>Pin bank</h2>
    <ol class="bank-steps">
      <li>Pick a term below.</li>
      <li>Click the spot in the street view where it belongs (a sign, door, tree), or drag the term onto the scene.</li>
      <li>Move along your route and repeat. Click a pin to remove it.</li>
    </ol>
    <div id="route-ctl" hidden>
      <p>Move along your route</p>
      <div class="row">
        <button id="route-back" type="button">&larr; Back</button>
        <button id="route-fwd" type="button">Forward &rarr;</button>
      </div>
    </div>
    <p id="hint"></p>
    <ul id="bank"></ul>
    <a class="btn" href="walk.html">Next: walk &amp; memorize &rarr;</a>
  </aside>
  <script src="js/config.js"></script>
  <script src="js/palace.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/place.js"></script>
</body>
</html>
